<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>动态迷宫 · 第一版</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b1020;color:#eaf0ff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  .wrap{width:min(96vw,980px);height:min(94vh,760px);display:grid;grid-template-rows:auto 1fr auto;gap:10px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#121936;border:1px solid #25315f;border-radius:14px;padding:10px 14px}
  .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
  .stat b{font-size:16px}
  .title{font-weight:800;letter-spacing:.5px}
  .game-shell{position:relative;background:#070b16;border:1px solid #27325d;border-radius:18px;overflow:hidden;min-height:0}
  canvas{width:100%;height:100%;display:block;touch-action:none}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,16,.78);backdrop-filter:blur(4px);z-index:5}
  .panel{width:min(88%,520px);background:#121936;border:1px solid #314071;border-radius:18px;padding:22px;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.35)}
  .panel h1{margin:0 0 8px;font-size:28px}
  .panel p{margin:8px 0;color:#b9c5e5;line-height:1.55}
  .panel button,.btn{border:0;border-radius:12px;padding:11px 16px;background:#6f8cff;color:white;font-weight:700;cursor:pointer}
  .panel button:hover,.btn:hover{filter:brightness(1.08)}
  .controls{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .hint{font-size:13px;color:#9eb0d4}
  .dpad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:5px}
  .dpad button{background:#18234a;border:1px solid #304071;color:white;border-radius:10px;font-size:20px;font-weight:800;touch-action:none;user-select:none;-webkit-user-select:none}
  .dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
  .log{font-size:13px;color:#b7c4e3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
  @media (max-width:680px){
    .wrap{height:100vh;width:100vw;gap:6px}
    .top{border-radius:0;border-left:0;border-right:0;padding:8px 10px}
    .game-shell{border-radius:0}
    .controls{padding:0 8px 8px}
    .log{max-width:48%}
    .hint{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="title">动态迷宫</div>
      <div class="hint">迷宫会观察你的行为并改变</div>
    </div>
    <div class="stats">
      <div class="stat">时间 <b id="time">00:00</b></div>
      <div class="stat">迷失值 <b id="lost">0</b></div>
      <div class="stat">难度 <b id="difficulty">50</b></div>
    </div>
  </div>

  <div class="game-shell" id="shell">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <div class="panel">
        <h1>动态迷宫</h1>
        <p>你只能看到附近区域。迷宫会根据你的速度、回头、停顿和迷路程度改变结构。</p>
        <p>电脑：方向键 / WASD　手机：下方方向键或在画面上滑动</p>
        <button id="startBtn">开始游戏</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="log" id="log">准备进入迷宫。</div>
    <div class="dpad">
      <button class="u" data-dir="up">▲</button>
      <button class="l" data-dir="left">◀</button>
      <button class="r" data-dir="right">▶</button>
      <button class="d" data-dir="down">▼</button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const shell = document.getElementById('shell');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const timeEl = document.getElementById('time');
  const lostEl = document.getElementById('lost');
  const diffEl = document.getElementById('difficulty');
  const logEl = document.getElementById('log');

  const COLS = 31, ROWS = 31;
  const VISION = 5;
  const MIN_PATH_BUFFER = 8;
  const TARGET_SECONDS = 240;

  let maze, seen, player, start, exit, running=false, startedAt=0, lastMoveAt=0;
  let moveCount=0, backtracks=0, deadEnds=0, sameCellVisits=0, recentMoves=[];
  let visitCount, lastPos, difficulty=50, directorTimer=0, elapsed=0;
  let hazards=[], particles=[], messageCooldown=0;
  let exitMoved=false;
  let swipeStart=null;
  let lastFrameAt=0;

  function resize(){
    const r = shell.getBoundingClientRect();
    canvas.width = Math.max(320, Math.floor(r.width * devicePixelRatio));
    canvas.height = Math.max(320, Math.floor(r.height * devicePixelRatio));
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    draw();
  }
  window.addEventListener('resize', resize);

  function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
  function key(x,y){ return y*COLS+x; }
  function inBounds(x,y){ return x>=0&&y>=0&&x<COLS&&y<ROWS; }
  function isFloor(x,y){ return inBounds(x,y) && maze[y][x]===0; }

  function generateMaze(){
    maze = Array.from({length:ROWS},()=>Array(COLS).fill(1));
    const sx=1, sy=1;
    const stack=[[sx,sy]];
    maze[sy][sx]=0;
    const dirs=[[2,0],[-2,0],[0,2],[0,-2]];
    while(stack.length){
      const [cx,cy]=stack[stack.length-1];
      const options=dirs
        .map(([dx,dy])=>[cx+dx,cy+dy,dx,dy])
        .filter(([nx,ny])=>nx>0&&ny>0&&nx<COLS-1&&ny<ROWS-1&&maze[ny][nx]===1);
      if(!options.length){ stack.pop(); continue; }
      const [nx,ny,dx,dy]=options[randInt(0,options.length-1)];
      maze[cy+dy/2][cx+dx/2]=0;
      maze[ny][nx]=0;
      stack.push([nx,ny]);
    }

    // Add some loops so dynamic changes don't feel too brittle.
    for(let i=0;i<55;i++){
      const x=randInt(1,COLS-2), y=randInt(1,ROWS-2);
      if(maze[y][x]===1){
        const h = isFloor(x-1,y)&&isFloor(x+1,y);
        const v = isFloor(x,y-1)&&isFloor(x,y+1);
        if(h||v) maze[y][x]=0;
      }
    }
  }

  function bfs(from, to){
    const q=[from], prev=new Map([[key(from.x,from.y),null]]);
    for(let qi=0; qi<q.length; qi++){
      const p=q[qi];
      if(p.x===to.x&&p.y===to.y){
        const path=[];
        let cur=key(p.x,p.y);
        while(cur!==null){
          const x=cur%COLS, y=Math.floor(cur/COLS);
          path.push({x,y});
          cur=prev.get(cur);
        }
        return path.reverse();
      }
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=p.x+dx, ny=p.y+dy, k=key(nx,ny);
        if(isFloor(nx,ny)&&!prev.has(k)){
          prev.set(k,key(p.x,p.y)); q.push({x:nx,y:ny});
        }
      }
    }
    return null;
  }

  function farthestFloor(from){
    const q=[from], dist=new Map([[key(from.x,from.y),0]]);
    let best=from, bestD=0;
    for(let qi=0;qi<q.length;qi++){
      const p=q[qi], d=dist.get(key(p.x,p.y));
      if(d>bestD){best=p;bestD=d;}
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=p.x+dx, ny=p.y+dy, k=key(nx,ny);
        if(isFloor(nx,ny)&&!dist.has(k)){dist.set(k,d+1);q.push({x:nx,y:ny});}
      }
    }
    return best;
  }

  function setupGame(){
    generateMaze();
    start={x:1,y:1};
    exit=farthestFloor(start);
    player={...start};
    seen=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    visitCount=Array.from({length:ROWS},()=>Array(COLS).fill(0));
    hazards=[];
    moveCount=backtracks=deadEnds=sameCellVisits=0;
    recentMoves=[];
    difficulty=50;
    directorTimer=0;
    exitMoved=false;
    elapsed=0;
    lastPos=null;
    visitCount[player.y][player.x]=1;
    reveal();
    seedHazards();
  }

  function seedHazards(){
    const floors=[];
    for(let y=1;y<ROWS-1;y++) for(let x=1;x<COLS-1;x++){
      if(isFloor(x,y) && Math.abs(x-start.x)+Math.abs(y-start.y)>8 && Math.abs(x-exit.x)+Math.abs(y-exit.y)>4){
        floors.push({x,y});
      }
    }
    shuffle(floors);
    hazards = [
      {type:'breath', ...floors.pop(), phase:Math.random()*Math.PI*2},
      {type:'fakeDead', ...floors.pop(), armed:true, timer:0},
      {type:'backOpen', ...floors.pop(), armed:true},
      {type:'mirror', ...floors.pop(), used:false},
      {type:'trap', ...floors.pop(), armed:true},
      {type:'trap', ...floors.pop(), armed:true},
      {type:'light', ...floors.pop(), armed:true},
    ];
  }

  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}

  function reveal(){
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      if(seen[y][x]===2) seen[y][x]=1;
    }
    for(let dy=-VISION;dy<=VISION;dy++) for(let dx=-VISION;dx<=VISION;dx++){
      const x=player.x+dx,y=player.y+dy;
      if(!inBounds(x,y)) continue;
      if(dx*dx+dy*dy<=VISION*VISION+2 && lineVisible(player.x,player.y,x,y)) seen[y][x]=2;
    }
  }

  function lineVisible(x0,y0,x1,y1){
    let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1;
    let err=dx-dy, x=x0, y=y0;
    while(!(x===x1&&y===y1)){
      const e2=2*err;
      if(e2>-dy){err-=dy;x+=sx;}
      if(e2<dx){err+=dx;y+=sy;}
      if(x===x1&&y===y1) return true;
      if(maze[y][x]===1) return false;
    }
    return true;
  }

  function move(dx,dy){
    if(!running) return;
    const nx=player.x+dx, ny=player.y+dy;
    if(!inBounds(nx,ny)) return;
    if(maze[ny][nx]===1 || breathBlocked(nx,ny)){
      pulseMessage(breathBlocked(nx,ny) ? '呼吸墙正处于闭合状态。' : '前面是墙。');
      return;
    }

    const now=performance.now();
    if(lastPos && nx===lastPos.x && ny===lastPos.y) backtracks++;
    lastPos={...player};
    player.x=nx; player.y=ny;
    moveCount++;
    lastMoveAt=now;

    recentMoves.push({dx,dy,t:now});
    if(recentMoves.length>20) recentMoves.shift();

    visitCount[ny][nx]++;
    if(visitCount[ny][nx]>=3) sameCellVisits++;

    const exits = [[1,0],[-1,0],[0,1],[0,-1]].filter(([ax,ay])=>isFloor(player.x+ax,player.y+ay)).length;
    if(exits===1 && !(player.x===exit.x&&player.y===exit.y)) deadEnds++;

    processHazards();
    reveal();

    if(player.x===exit.x&&player.y===exit.y) win();
  }

  function breathBlocked(x,y){
    if(!running) return false;
    const now=performance.now()/1000;
    return hazards.some(h =>
      h.type==='breath' && h.x===x && h.y===y &&
      Math.sin(now*2+h.phase) > 0.15
    );
  }

  function processHazards(){
    for(const h of hazards){
      const d=Math.abs(h.x-player.x)+Math.abs(h.y-player.y);
      if(h.type==='trap' && h.armed && d===0){
        h.armed=false;
        difficulty=Math.max(0,difficulty-8);
        pulseMessage('你踩中了迟滞陷阱：迷宫暂时变得更温和。');
      }
      if(h.type==='fakeDead' && h.armed && d===0){
        h.timer=performance.now();
        pulseMessage('这里似乎是死路……也许等一下？');
      }
      if(h.type==='backOpen' && h.armed && d===0){
        h.armed=false;
        setTimeout(()=>{
          if(!running) return;
          openNearbyWall(h.x,h.y);
          pulseMessage('你身后传来了一声轻响。');
        },1000);
      }
      if(h.type==='mirror' && !h.used && d===0){
        h.used=true;
        mutateNearby(h.x,h.y,true);
        pulseMessage('这个路口好像和刚才不一样。');
      }
      if(h.type==='light' && h.armed && d===0){
        h.armed=false;
        pulseMessage('你发现了一盏微光，附近地图被短暂照亮。');
        revealRadius(8);
      }
    }
  }

  function revealRadius(r){
    for(let y=Math.max(0,player.y-r);y<=Math.min(ROWS-1,player.y+r);y++)
      for(let x=Math.max(0,player.x-r);x<=Math.min(COLS-1,player.x+r);x++)
        if((x-player.x)**2+(y-player.y)**2<=r*r) seen[y][x]=Math.max(seen[y][x],1);
  }

  function canSafelyToggle(x,y,newVal){
    const old=maze[y][x];
    maze[y][x]=newVal;
    const ok=!!bfs(player,exit);
    maze[y][x]=old;
    return ok;
  }

  function openNearbyWall(cx,cy){
    const candidates=[];
    for(let y=Math.max(1,cy-2);y<=Math.min(ROWS-2,cy+2);y++) for(let x=Math.max(1,cx-2);x<=Math.min(COLS-2,cx+2);x++){
      if(maze[y][x]===1 && Math.abs(x-player.x)+Math.abs(y-player.y)>1){
        const h=isFloor(x-1,y)&&isFloor(x+1,y);
        const v=isFloor(x,y-1)&&isFloor(x,y+1);
        if(h||v) candidates.push({x,y});
      }
    }
    if(candidates.length){
      const p=candidates[randInt(0,candidates.length-1)];
      maze[p.y][p.x]=0;
    }
  }

  function mutateNearby(cx,cy,preferOpen=false){
    const candidates=[];
    for(let y=Math.max(1,cy-3);y<=Math.min(ROWS-2,cy+3);y++) for(let x=Math.max(1,cx-3);x<=Math.min(COLS-2,cx+3);x++){
      if(Math.abs(x-player.x)+Math.abs(y-player.y)<=1) continue;
      if(x===exit.x&&y===exit.y) continue;
      if(preferOpen && maze[y][x]===1){
        const h=isFloor(x-1,y)&&isFloor(x+1,y), v=isFloor(x,y-1)&&isFloor(x,y+1);
        if(h||v) candidates.push({x,y,newVal:0});
      } else if(!preferOpen && maze[y][x]===0){
        const degree=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>isFloor(x+dx,y+dy)).length;
        if(degree>=2 && canSafelyToggle(x,y,1)) candidates.push({x,y,newVal:1});
      }
    }
    if(candidates.length){
      const p=candidates[randInt(0,candidates.length-1)];
      maze[p.y][p.x]=p.newVal;
      return true;
    }
    return false;
  }

  function playerMetrics(){
    const now=performance.now();
    const idle=(now-lastMoveAt)/1000;
    const revisits=sameCellVisits;
    const backRate=moveCount?backtracks/moveCount:0;
    const deadRate=moveCount?deadEnds/moveCount:0;
    let speed=0;
    const recent=recentMoves.filter(m=>now-m.t<8000);
    if(recent.length>1) speed=recent.length/8;
    let lostScore=Math.round(Math.min(100, revisits*4 + backRate*60 + deadRate*80 + Math.max(0,idle-3)*3));
    return {idle,revisits,backRate,deadRate,speed,lostScore};
  }

  function updateDirector(dt){
    directorTimer += dt;
    if(directorTimer<2.2) return;
    directorTimer=0;

    const m=playerMetrics();
    let target=55;
    if(m.speed>1.3 && m.lostScore<20) target+=18;
    if(m.backRate<0.12 && m.speed>1.0) target+=8;
    if(m.lostScore>45) target-=20;
    if(m.idle>6) target-=8;
    difficulty += (target-difficulty)*0.22;
    difficulty=Math.max(10,Math.min(90,difficulty));

    const chance = 0.18 + difficulty/350;
    if(Math.random()<chance){
      const roll=Math.random();
      if(roll<0.35){
        const changed=mutateBehindPlayer();
        if(changed && messageCooldown<=0) pulseMessage('你走远后，某处墙体发生了变化。');
      }else if(roll<0.65 && difficulty>55){
        mutateAheadPlayer();
      }else if(roll<0.82 && m.lostScore>40){
        rescuePlayer();
      }else if(!exitMoved && elapsed>75 && difficulty>65){
        moveExitSafely();
      }
    }
  }

  function mutateBehindPlayer(){
    if(!lastPos) return false;
    const vx=player.x-lastPos.x, vy=player.y-lastPos.y;
    const cx=player.x-vx*3, cy=player.y-vy*3;
    if(!inBounds(cx,cy)) return false;
    return mutateNearby(cx,cy,Math.random()<0.45);
  }

  function mutateAheadPlayer(){
    if(!lastPos) return false;
    const vx=player.x-lastPos.x, vy=player.y-lastPos.y;
    const cx=player.x+vx*4, cy=player.y+vy*4;
    if(!inBounds(cx,cy)) return false;
    const changed=mutateNearby(cx,cy,false);
    if(changed) pulseMessage('前方传来墙体移动的声音。');
    return changed;
  }

  function rescuePlayer(){
    const path=bfs(player,exit);
    if(!path||path.length<2) return;
    // Open a shortcut near player if possible.
    openNearbyWall(player.x,player.y);
    revealRadius(6);
    pulseMessage('附近似乎出现了一条更容易辨认的路。');
  }

  function moveExitSafely(){
    const dist=Math.abs(exit.x-player.x)+Math.abs(exit.y-player.y);
    if(dist<MIN_PATH_BUFFER) return;
    const old={...exit};
    const candidate=farthestFloor(player);
    if(Math.abs(candidate.x-player.x)+Math.abs(candidate.y-player.y)>MIN_PATH_BUFFER){
      exit=candidate;
      exitMoved=true;
      if(!bfs(player,exit)) exit=old;
      else pulseMessage('远处似乎有什么东西改变了位置。');
    }
  }

  function updateHazards(dt){
    const now=performance.now();
    for(const h of hazards){
      if(h.type==='fakeDead' && h.timer && now-h.timer>1800){
        h.timer=0; h.armed=false;
        openNearbyWall(h.x,h.y);
        pulseMessage('死路旁的一堵墙缓缓打开了。');
      }
    }
  }

  function draw(){
    const cssW=canvas.clientWidth||800, cssH=canvas.clientHeight||600;
    ctx.clearRect(0,0,cssW,cssH);

    const tile=Math.floor(Math.min(cssW/13, cssH/13));
    const viewTilesX=Math.ceil(cssW/tile)+2, viewTilesY=Math.ceil(cssH/tile)+2;
    const ox=Math.floor(cssW/2 - player?.x*tile - tile/2);
    const oy=Math.floor(cssH/2 - player?.y*tile - tile/2);

    ctx.fillStyle='#050812'; ctx.fillRect(0,0,cssW,cssH);
    if(!maze||!player) return;

    const minX=Math.max(0,Math.floor(-ox/tile)-1), maxX=Math.min(COLS-1,minX+viewTilesX);
    const minY=Math.max(0,Math.floor(-oy/tile)-1), maxY=Math.min(ROWS-1,minY+viewTilesY);

    for(let y=minY;y<=maxY;y++) for(let x=minX;x<=maxX;x++){
      const state=seen[y][x];
      if(state===0) continue;
      const px=ox+x*tile, py=oy+y*tile;

      if(maze[y][x]===1){
        ctx.fillStyle=state===2?'#2a3457':'#151b2d';
        ctx.fillRect(px,py,tile+1,tile+1);
        if(state===2){
          ctx.strokeStyle='rgba(160,178,230,.10)';
          ctx.strokeRect(px+.5,py+.5,tile-1,tile-1);
        }
      }else{
        ctx.fillStyle=state===2?'#10182d':'#0b1020';
        ctx.fillRect(px,py,tile+1,tile+1);
      }
    }

    // Breath-wall visual pulse on nearby hazard.
    const now=performance.now()/1000;
    for(const h of hazards){
      if(h.type!=='breath' || !seen[h.y]?.[h.x]) continue;
      const px=ox+h.x*tile, py=oy+h.y*tile;
      const closed=Math.sin(now*2+h.phase)>0.15;
      const a=closed?.68:.20;
      ctx.fillStyle=`rgba(120,180,255,${a})`;
      ctx.fillRect(px+tile*.12,py+tile*.12,tile*.76,tile*.76);
      if(closed){
        ctx.strokeStyle='rgba(220,240,255,.9)';
        ctx.lineWidth=2;
        ctx.strokeRect(px+tile*.18,py+tile*.18,tile*.64,tile*.64);
      }
    }

    if(seen[exit.y][exit.x]>0){
      const px=ox+exit.x*tile+tile/2, py=oy+exit.y*tile+tile/2;
      ctx.beginPath(); ctx.arc(px,py,tile*.28,0,Math.PI*2);
      ctx.fillStyle=seen[exit.y][exit.x]===2?'#62e6a8':'#2d654f'; ctx.fill();
      ctx.strokeStyle='#c7ffe2'; ctx.lineWidth=2; ctx.stroke();
    }

    const px=ox+player.x*tile+tile/2, py=oy+player.y*tile+tile/2;
    ctx.beginPath(); ctx.arc(px,py,tile*.29,0,Math.PI*2);
    ctx.fillStyle='#ffcf5b'; ctx.fill();
    ctx.strokeStyle='#fff3c0'; ctx.lineWidth=2; ctx.stroke();

    // Soft vignette around vision radius.
    const grad=ctx.createRadialGradient(cssW/2,cssH/2,tile*2,cssW/2,cssH/2,tile*(VISION+1.4));
    grad.addColorStop(0,'rgba(0,0,0,0)');
    grad.addColorStop(.7,'rgba(0,0,0,.10)');
    grad.addColorStop(1,'rgba(0,0,0,.72)');
    ctx.fillStyle=grad; ctx.fillRect(0,0,cssW,cssH);
  }

  function updateUI(){
    const sec=Math.floor(elapsed);
    timeEl.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
    const m=playerMetrics();
    lostEl.textContent=m.lostScore;
    diffEl.textContent=Math.round(difficulty);
  }

  function pulseMessage(msg){
    logEl.textContent=msg;
    messageCooldown=2.5;
  }

  function win(){
    running=false;
    const sec=Math.floor(elapsed);
    const m=playerMetrics();
    overlay.innerHTML=`<div class="panel"><h1>你逃出来了</h1>
      <p>用时 ${Math.floor(sec/60)} 分 ${sec%60} 秒 · 移动 ${moveCount} 步 · 回头 ${backtracks} 次</p>
      <p>最终迷失值 ${m.lostScore} · 最终难度 ${Math.round(difficulty)}</p>
      <button id="again">再来一局</button></div>`;
    overlay.style.display='flex';
    document.getElementById('again').onclick=startGame;
  }

  function loseByTime(){
    running=false;
    overlay.innerHTML=`<div class="panel"><h1>迷宫暂时困住了你</h1>
      <p>这一局已超过 5 分钟。你可以重新挑战，迷宫会重新生成。</p>
      <button id="again">再来一局</button></div>`;
    overlay.style.display='flex';
    document.getElementById('again').onclick=startGame;
  }

  function startGame(){
    setupGame();
    overlay.style.display='none';
    running=true;
    startedAt=performance.now();
    lastFrameAt=startedAt;
    lastMoveAt=startedAt;
    pulseMessage('迷宫正在观察你的行动。');
  }

  function gameLoop(t){
    const dt = lastFrameAt ? Math.min(0.1,(t-lastFrameAt)/1000) : 1/60;
    lastFrameAt=t;
    if(running){
      elapsed=(t-startedAt)/1000;
      if(messageCooldown>0) messageCooldown-=dt;
      updateDirector(dt);
      updateHazards(dt);
      updateUI();
      if(elapsed>=300) loseByTime();
    }
    draw();
    requestAnimationFrame(gameLoop);
  }

  startBtn.addEventListener('click',startGame);

  const keyMap={
    ArrowUp:[0,-1],w:[0,-1],W:[0,-1],
    ArrowDown:[0,1],s:[0,1],S:[0,1],
    ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],
    ArrowRight:[1,0],d:[1,0],D:[1,0],
  };
  window.addEventListener('keydown',e=>{
    if(keyMap[e.key]){
      e.preventDefault();
      move(...keyMap[e.key]);
    }
  },{passive:false});

  document.querySelectorAll('.dpad button').forEach(btn=>{
    const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
    btn.addEventListener('pointerdown',e=>{e.preventDefault();move(...dirs[btn.dataset.dir]);});
  });

  canvas.addEventListener('pointerdown',e=>{swipeStart={x:e.clientX,y:e.clientY};});
  canvas.addEventListener('pointerup',e=>{
    if(!swipeStart) return;
    const dx=e.clientX-swipeStart.x, dy=e.clientY-swipeStart.y;
    swipeStart=null;
    if(Math.max(Math.abs(dx),Math.abs(dy))<20) return;
    if(Math.abs(dx)>Math.abs(dy)) move(dx>0?1:-1,0);
    else move(0,dy>0?1:-1);
  });

  setupGame();
  resize();
  requestAnimationFrame(gameLoop);
})();
</script>
</body>
</html>
